{% if status == 'approved' %}
<span class="quiz-badge badge-pass">Approved</span>
{% elif status == 'pending' %}
<span class="quiz-badge" style="background: rgba(59,130,246,0.12);color:#3b82f6;">Pending Review</span>
{% elif status == 'rejected' %}
<span class="quiz-badge badge-fail">Rejected</span>
{% else %}
<span class="quiz-badge" style="background: rgba(245,158,11,0.12);color:#f59e0b;">Draft</span>
{% endif %}
